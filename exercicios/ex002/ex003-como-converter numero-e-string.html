<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro programa</title>
    <style>
        body {
            font: normal 1.5em Arial;
            background-color: lightgray;
            color: rgb(109, 54, 54);
        }
    </style>
</head>
<body>
    <h1>Olá, mundo!</h1>
    <p>Já me livrei da maldição</p>
    <script>
        var n1 = Number.parseInt(window.prompt('Digite um número: a'))
        var n2 = Number.parseInt(window.prompt('Digite outro número: ')) /* Há 3 maneiras de conversar a string em number, e são as seguintes:
        Number.parseInt() para numero inteiros
        Number.parseFloat() para número com ponto flutuante
        Number() assim o javascript identifica por conta o que aplicar
        
        E para fazer o contrario há 2 maneiras:
        String(n)
        n.toString()
        
        */
        var soma = n1 + n2
        window.alert('A soma é: ' + String(soma))

        /* Formantando Strings
        var s = 'JavaScript'
        'Eu estou aprendendo s' não faz interpolação
        'Eu estou aprendendo' + s usa concatenação
        'Eu estou aprendendo ${s}' Usa template string
        */
    </script>
</body>
</html>
