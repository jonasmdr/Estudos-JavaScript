<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var n1 = 1543.5
        window.alert(`${n1.toFixed(2)}`)
        window.alert(`${n1.toFixed(2).replace('.',',')}`) //Serve para trocar o ponto por vírgula
        window.alert(`${n1.toLocaleString('pt-BR', {style:'currency',currency:'BRL'})}`) //É uma string localizada. Serve para conversar o valor em salário
    </script>
</body>
</html>
