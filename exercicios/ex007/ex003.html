<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercicio</title>
    <style>
        body {
            font: normal 1.1em Arial;
        }

        input.n1n2 {
            width: 60px;
        }

        button {
            padding: 8px;
            margin-left: 90%;
        }
    </style>
</head>
<body id="body">
    <button onclick="cliquei()">Alterar tema</button>
    <h1>Praticas</h1>
    <input class="n1n2" type="number" name="n1" id="n1">
    <input class="n1n2" type="number" name="n2" id="n2">
    <input type="button" value="Calcular" onclick="clicar()">
    <div id="calculo">
        O resultado aqui!
    </div>
    <h1>Identificador de altura</h1>
    <input class="n1n2" type="number" name="alt" id="alt">
    <input type="button" value="Verificar" onclick="apertar()">
    <div id="media">
         
    </div>

    <h1>Consulta de multa</h1>
    <input class="n1n2" type="number" name="tvel" id="tvel">
    <input id="botaomulta" type="button" value="Verificar">
    <div id="multa">
        
    </div>
    <p>Dirija com segurança!!</p>

    <script>
        let num1 = window.document.querySelector('input#n1');
        let num2 = window.document.querySelector('input#n2');
        let calculo = window.document.querySelector('div#calculo');
        function clicar() {
            let n1 = Number(num1.value);
            let n2 = Number(num2.value);
            let res = n1 + n2;
            calculo.innerHTML = `A soma dos valores ${n1} e ${n2} é = ${res}`
            //window.alert(`A soma dos valores ${n1} e ${n2} é = ${res}`)
        }

        let alt = window.document.querySelector('input#alt');
        let media = window.document.querySelector('div#media');
        function apertar() {
            let alt1 = Number(alt.value);
            media.innerHTML += `${alt1} `;
            if (alt1 <= 170) {
                media.innerHTML = `Sua altura é: ${alt1}. Você está abaixo da média`
            } else {
                if (alt1 == 171) {
                    media.innerHTML = `Sua altura é: ${alt1}. Você tem altura média`
                } else {
                    if (alt1 >= 172) {
                        media.innerHTML = `Sua altura é: ${alt1}. Você está acima da média`
                    } 
                }
            }
        }
        let body = window.document.querySelector('body#body')
        function cliquei() {
            body.style.background = 'gray'
            body.style.color = 'white'
        }

        let vel = window.document.querySelector('input#tvel')
        let botaomulta = window.document.querySelector('input#botaomulta')
        let multa = window.document.querySelector('div#multa')
        botaomulta.addEventListener('click', verificar)
        function verificar() {
            let vel1 = Number(vel.value)
            if (vel1 > 60) {
                multa.innerHTML = 'Você passou o limite de velocidade. MULTADO!'
            } else {
                multa.innerHTML = ''
            }
        }
    </script>
</body>
</html>
