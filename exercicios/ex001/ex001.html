<!-- No JavaScript moderno, além de utilizar a palavra VAR, também podemos usar a palavra LET.-->

<!-- O nome de cada variavel é chamado de identificador 
* Podem começar com letra, $ ou _

* Não podem começar com números

* É possível usar letras ou números

* É possível usar acentos e símbolos

* Não podem conter espaços

* Não podem ser palavras reservadas

-->

<!-- numa variavel vai dar o nome a ela e o valor que lhe colocado é chamado de atribuição-->

const: (De constante) Quando o valor nunca for mudar (ex: data de nascimento, CPF, ou a URL de um site). Isso deixa seu código ainda mais seguro!
