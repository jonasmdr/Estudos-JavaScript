    <!-- 
        -Operadores Relacionais-
        PARA TODA EXPRESSÃO QUE TENHA UM OPERADOR RELACIONAR LIGADO A ELA, O RESULTADO DESSA EXPRESSÃO SERÁ SEMPRE UM VALOR BOOLEANO, DO TIPO VERDADEIRO OU FALSO
    5 > 2 -> TRUE
    7 < 4 -> FALSE
    8 >= 8 -> TRUE
    9 <= 7 -> FALSE
    5 == 5 -> TRUE
    4 != 4 -> FALSE
    5 !== '5' - > TRUE

    tem também o operador de identidade
    5 === '5' -> false
    por conta de que pro js 5 == '5' mesma que um esteja em string tem a mesma grandeza e ele reconhece como igual, nesse caso para diferenciar teria que usar o ===
    -->
