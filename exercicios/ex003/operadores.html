       * aritméticos:| + | - | * | / = divasão real | % = divisão inteira, resto da divisão, valor que sobra antes de colocar a virgula | ** = a potencia. ex.: 5 ** 2 = 5² = 25 |
       * atribuição

        -Ordem de Precedência dos operadores aritméticos-
        () Primeiro resolve os parenteses
        ** Segundo a ser resolvido
        *, / e % terceiro a ser resolvido, e ser tiver mais de um deles, é resolvido na ordem da esquerda pra direita
        + e - último a ser resolvido
--------------------------------------------------------------------
        -Atribuição simples
        var a = 5 + 3 (8)
        var b = a % 5 (que vai dar 3)
        var c = 5 * b ** 2 (45)
        var d = 10 - a / 2 (6)
        var e = 6 * 2 / d (2)
        var f = b % e + 4 / e (3)
        var n = 3
        n = n + 4 (7) simplificando n += 4 (7) isso só acontece se a mesma variavel recebe ela mesma + outro
        
        # Incremento e Decremento
        var x = 5
        x = x + 1
        x = x - 1
        x ++
        x --
