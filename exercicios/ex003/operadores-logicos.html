    <title>Operadores Lógicos</title>

<body>
    

    <!--
        -Operadores Lógicos-
    
        ! -> negação - ex.: quero uma caneta, mas ela não pode ser azul, tu pode entregar qualquer caneta menos a azul
    
    && -> conjunção - ex.: se eu peço uma caneta azul e uma vermelha, só vou ficar satisfeito se entregar desse jeito
    
    || -> disjunção - ex.: peço uma caneta azul ou vermelha, se receber qualquer uma das duas ou as duas, tá tudo certo, mas se não entregar nenhuma ou de uma cor que não queira, aí não fico satisfeito


    negação ! -> é trato como operador onario, ele só tem um operando, isso, depois da ! ou coloco true ou coloco false ou coloca uma expressão que vá dar true ou false

    !true -> false - uma coisa que não é verdadeira é falsa
    !false -> true uma coisa que não é falsa é verdadeira

    conjunção && -> A regra de ouro do && é extremamente estrita: o resultado final só será verdadeiro (true) se TODAS as condições envolvidas também forem verdadeiras. Se apenas uma única condição for falsa, a expressão inteira se torna falsa.

    true && true -> true
    true && false -> false
    false && true -> false
    false && false -> false

    disjunção || -> A regra de ouro do || é: o resultado final será verdadeiro (true) se PELO MENOS UMA das condições for verdadeira. A expressão inteira só será falsa se absolutamente todas as condições envolvidas forem falsas.

    true || true -> true
    true || false -> true
    false || true -> true
    false || false -> false

    quanddo tem operadores aritmeticos, relacionais e lógicos na mesma expressão, irá resolver primeiro os aritmeticos, depois relacionais e depois os lógicos

    e se tiver mais de um lógico 
    a ordem é: primeiro não depois o E e depois o OU
    ! -> && -> ||
    -->
</body>
</html>
