    <!-- 
      -Operador Ternário-
    O operador ternário é um dos atalhos mais elegantes e práticos da programação. Ele recebe esse nome porque é o único operador que exige três partes para funcionar.

    Basicamente, ele serve para substituir um bloco simples de if...else (se / senão) transformando-o em uma única linha de código.

    A Regra (Sintaxe)
    O operador ternário é composto por um ponto de interrogação (?) e dois pontos (:). Ele funciona literalmente como se você estivesse fazendo uma pergunta para o computador:

    condição ? valor_se_verdadeiro : valor_se_falso

    condição: O teste que você quer fazer.

    ? (Então): O que acontece se a resposta for SIM (true).

    : (Senão): O que acontece se a resposta for NÃO (false).

    Exemplo do Mundo Real
    Imagine que você está saindo de casa e olha para o céu para tomar uma decisão rápida:
    "Está chovendo? Se sim, levo o guarda-chuva. Senão, levo óculos de sol."

    No operador ternário, ficaria assim:
    está chovendo ? "guarda-chuva" : "óculos de sol"

    -->
