<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Rastreador de Partidas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Rastreador de Partidas</h1>
        
        <div class="input-section">
            <input type="text" id="gameName" placeholder="Ex: Valorant, V Rising..." autocomplete="off">
            <select id="matchResult">
                <option value="Vitória">Vitória</option>
                <option value="Derrota">Derrota</option>
            </select>
            <button id="addBtn">Adicionar</button>
        </div>

        <ul id="matchList">
            </ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
